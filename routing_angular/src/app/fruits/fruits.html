<h2 class="mb-4 text-center">Lista della Frutta</h2>

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
  @for (fruit of fruits; track fruit.name) {
    <div class="col">
      <div class="card h-100 shadow-sm border-0 bg-warning-subtle text-dark">
        <div class="card-body text-center">
          <div class="display-3">{{ fruit.emoji }}</div>
          <h5 class="card-title text-capitalize mt-3">{{ fruit.name }}</h5>
        </div>
      </div>
    </div>
  } @empty {
    <div class="col-12 text-center">
      <p class="alert alert-info">Il cesto della frutta è vuoto!</p>
    </div>
  }
</div>
